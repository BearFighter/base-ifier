name: Release

# Tag a commit v<version> (matching package.json) and push the tag:
#   git tag v0.1.1 && git push --tags
# This builds the Windows installer and publishes it, with latest.yml, to a
# GitHub Release. Installed apps update themselves from that release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v${v}"; exit 1; }
      - name: Build and publish the installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
