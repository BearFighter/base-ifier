name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc -p electron/tsconfig.json --noEmit
      - run: npm test
      - run: npm run build

  smoke:
    # the packaged renderer must load and render on every platform we ship
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run electron:compile
      - name: Smoke-test the packaged renderer
        if: runner.os != 'Linux'
        run: npx electron . --smoke
      - name: Smoke-test the packaged renderer (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --smoke --no-sandbox
