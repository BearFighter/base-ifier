name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsc -p electron/tsconfig.json --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run electron:compile
      - name: Smoke-test the packaged renderer
        run: npx electron . --smoke
